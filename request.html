<style>
  :root{
    --void:#0c0a0a;--card:#1a1010;--ember:#3a1818;
    --blood-bright:#d62c2c;--bone:#f0e4d0;--bone-dim:#9c8c7a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--void);color:var(--bone);font-family:'Inter',sans-serif;min-height:100vh;}
  .topbar{padding:20px 24px;border-bottom:1px solid var(--ember);}
  .back{color:var(--bone-dim);text-decoration:none;font-size:0.85rem;font-weight:500;}
  .back:hover{color:var(--blood-bright);}
  main{max-width:560px;margin:0 auto;padding:48px 24px 90px;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:0.02em;margin-bottom:14px;}
  p{color:var(--bone-dim);line-height:1.7;font-size:0.95rem;margin-bottom:26px;}
  label{display:block;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--bone-dim);margin-bottom:6px;}
  input,textarea{
    width:100%;background:var(--card);border:1px solid var(--ember);color:var(--bone);
    font-family:'Inter',sans-serif;font-size:0.92rem;padding:11px 14px;border-radius:8px;
    outline:none;margin-bottom:20px;transition:border-color 0.2s ease;
  }
  input:focus,textarea:focus{border-color:var(--bone-dim);}
  textarea{resize:vertical;min-height:90px;}
  button{
    background:var(--blood-bright);color:#0c0a0a;font-weight:700;border:none;
    padding:13px 28px;border-radius:6px;font-size:0.92rem;cursor:pointer;
    transition:background 0.2s ease;
  }
  button:hover{background:#ef4040;}
  .note{margin-top:18px;font-size:0.8rem;color:var(--bone-dim);}
  .confirm{display:none;color:var(--blood-bright);font-weight:600;margin-top:16px;font-size:0.9rem;}
</style>
</head>
