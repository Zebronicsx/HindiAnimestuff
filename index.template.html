<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover honours notch safe areas; maximum-scale stops pinch drift -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06060b" />
    <meta name="description" content="AnimesFreak — Stream the Madness. Watch online or download anime, movies and web series in Hindi dub. 480p / 720p HD / 1080p FHD multi audio." />
    <meta property="og:title" content="AnimesFreak — Stream the Madness" />
    <meta property="og:description" content="Anime OTT network with Hindi dub, multi audio and direct downloads. 1,700+ titles in the vault." />
    <meta property="og:type" content="website" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnimesFreak" />
    <meta name="application-name" content="AnimesFreak" />
    <link rel="icon" type="image/png" href="data:image/png;base64,__FAVICON__" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+JP:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <title>AnimesFreak — Stream the Madness | Anime OTT Network</title>
    <style>
      html, body { margin: 0; padding: 0; background: #06060b; width: 100%; max-width: 100%; overflow-x: hidden; }
      /* Native app launch screen: crest on ink, red sweep bar */
      #boot-splash {
        position: fixed; inset: 0; z-index: 300; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 42%, #12121c 0%, #06060b 62%);
        color: #f4f2ec; font-family: "Space Grotesk", system-ui, sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #boot-splash .bs-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      #boot-splash .bs-mark {
        width: 108px; height: 108px; border: 1px solid rgba(255,42,42,.5); border-radius: 26px;
        overflow: hidden; transform: skewX(-6deg); background: #0b0b13;
        box-shadow: 0 0 60px -10px rgba(255,42,42,.75), 0 0 0 6px rgba(255,42,42,.05);
        animation: bsPop .7s cubic-bezier(.22,1,.36,1) both;
      }
      #boot-splash .bs-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #boot-splash .bs-name {
        font-family: "Anton", Impact, sans-serif; letter-spacing: .24em; text-transform: uppercase;
        font-size: 16px; color: #f4f2ec; transform: skewX(-6deg);
        animation: bsFade .6s .22s cubic-bezier(.22,1,.36,1) both;
      }
      #boot-splash .bs-name span { color: #ff2a2a; }
      #boot-splash .bs-bar {
        width: 178px; height: 3px; background: rgba(244,242,236,.1); overflow: hidden;
        animation: bsFade .5s .3s both;
      }
      #boot-splash .bs-bar i {
        display: block; height: 100%; width: 40%; background: #ff2a2a;
        box-shadow: 0 0 12px #ff2a2a; animation: bsSlide 1.1s ease-in-out infinite;
      }
      #boot-splash .bs-tag {
        font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: .34em;
        text-transform: uppercase; color: #8a8a9a; animation: bsFade .5s .36s both;
      }
      #boot-splash .bs-help {
        display: none; width: min(520px, calc(100vw - 40px)); padding: 24px;
        border: 1px solid rgba(255,42,42,.4); background: #0b0b13; text-align: center;
      }
      #boot-splash .bs-help strong { display: block; color: #f4f2ec; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
      #boot-splash .bs-help p { color: #8a8a9a; font-size: 13px; line-height: 1.6; }
      #boot-splash .bs-help code { color: #22e6ff; }
      #boot-splash .bs-help a {
        display: inline-block; margin-top: 10px; padding: 11px 18px; color: #fff;
        background: #ff2a2a; font-size: 11px; font-weight: 700; letter-spacing: .16em;
        text-decoration: none; text-transform: uppercase;
      }
      @keyframes bsSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }
      @keyframes bsFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes bsPop { from { opacity: 0; transform: skewX(-6deg) scale(.86); } to { opacity: 1; transform: skewX(-6deg) scale(1); } }
      @media (max-width: 380px) { #boot-splash .bs-mark { width: 92px; height: 92px; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="bs-wrap">
          <div class="bs-mark"><img src="data:image/png;base64,__ICON512__" alt="AnimesFreak oni crest" /></div>
          <div class="bs-name">Animes<span>Freak</span></div>
          <div class="bs-bar"><i></i></div>
          <div class="bs-tag">Loading the vault</div>
          <div class="bs-help" id="boot-help">
            <strong>Unbuilt source files detected</strong>
            <p>
              This host is serving the development file. Upload <code>deploy/index.html</code>
              or <code>dist/index.html</code> as your website's root <code>index.html</code>.
            </p>
            <a id="built-site-link" href="./dist/index.html">Try built site</a>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;display:grid;place-items:center;background:#06060b;color:#f4f2ec;font-family:system-ui,sans-serif;text-align:center;padding:24px;z-index:400">
        <div>
          <p style="font-size:20px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#ff2a2a">AnimesFreak</p>
          <p style="margin-top:10px;font-size:14px;color:#8a8a9a">This site needs JavaScript enabled. It is a static, single-file build — just open it in any modern browser.</p>
        </div>
      </div>
    </noscript>
    <script>
      // A plain static host cannot execute /src/main.tsx. Instead of showing an
      // endless loader, explain exactly which compiled file must be uploaded.
      window.__AF_WATCHDOG__ = window.setTimeout(function () {
        var state = document.documentElement.dataset.afApp;
        if (state === "ready" || state === "booting") return;
        var bar = document.querySelector("#boot-splash .bs-bar");
        var tag = document.querySelector("#boot-splash .bs-tag");
        var help = document.getElementById("boot-help");
        if (bar) bar.style.display = "none";
        if (tag) tag.style.display = "none";
        if (help) help.style.display = "block";
      }, 4500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
