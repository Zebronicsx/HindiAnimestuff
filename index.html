<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HindiAnimeStuff — Dubbed Anime, Discovered</title>
<link rel="icon" type="image/png" href="/HindiAnimestuff.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
  --void:#0b0714;
  --card:#161025;
  --card-hover:#201634;
  --ember:#2d8f73;
  --blood:#7c3aed;
  --blood-bright:#b26cff;
  --bone:#f5f3ff;
  --bone-dim:#b7b2d6;
  --gold:#3ddc97;
}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--void);
    color:var(--bone);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(ellipse 70% 45% at 50% -5%, rgba(158,27,27,0.18), transparent 60%),
radial-gradient(ellipse 50% 35% at 100% 95%, rgba(158,27,27,0.08), transparent 60%);
pointer-events:none;
z-index:0;
}
body::after{
content:'';
position:fixed;
inset:0;
background-image:
repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, transparent 1px, transparent 2px);
pointer-events:none;
z-index:0;
mix-blend-mode:overlay;
}

header{
position:relative;
z-index:2;
padding:20px 24px 28px;
text-align:center;
}
.mark{
display:inline-flex;
align-items:center;
gap:10px;
margin-bottom:18px;
}
.mark-glyph{
width:28px;height:28px;
border:2px solid var(--blood-bright);
transform:rotate(45deg);
position:relative;
}
.mark-glyph::after{
content:'';
position:absolute;
inset:5px;
background:var(--blood-bright);
}
.brand{
font-family:'Bebas Neue',sans-serif;
font-size:clamp(2.1rem,7.5vw,4rem);
letter-spacing:0.02em;
line-height:1;
white-space:nowrap;
}
.brand .hi{color:var(--bone);}
.brand .ja{color:var(--blood-bright);}
.tagline{
margin-top:12px;
color:var(--bone-dim);
font-size:0.92rem;
letter-spacing:0.04em;
font-weight:500;
}

.stat-strip{
display:flex;
justify-content:center;
gap:32px;
margin-top:26px;
flex-wrap:wrap;
}
.stat{text-align:center;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--blood-bright);}
.stat-label{font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--bone-dim);}

.topnav{
position:relative;z-index:3;
display:flex;
justify-content:flex-end;
padding:18px 24px 0;
}
.menu-btn{
width:38px;height:38px;
border:1px solid var(--ember);
border-radius:8px;
background:transparent;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
cursor:pointer;
transition:border-color 0.2s ease;
}
.menu-btn:hover{border-color:var(--bone-dim);}
.menu-btn span{
width:16px;height:1.5px;
background:var(--bone-dim);
border-radius:1px;
transition:all 0.2s ease;
}
.menu-btn.open span:nth-child(1){transform:translateY(5.5px) rotate(45deg);}
.menu-btn.open span:nth-child(2){opacity:0;}
.menu-btn.open span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg);}

.menu-panel{
position:absolute;
top:62px;right:24px;
background:var(--card);
border:1px solid var(--ember);
border-radius:10px;
min-width:190px;
padding:8px;
display:none;
flex-direction:column;
gap:2px;
box-shadow:0 16px 40px -10px rgba(0,0,0,0.6);
z-index:10;
}
.menu-panel.open{display:flex;}
.menu-panel a{
color:var(--bone-dim);
text-decoration:none;
font-size:0.85rem;
font-weight:500;
padding:10px 12px;
border-radius:6px;
transition:all 0.15s ease;
}
.menu-panel a:hover{
background:var(--card-hover);
color:var(--bone);
}

.search-wrap{
position:relative;z-index:2;
max-width:420px;
margin:0 auto 28px;
padding:0 20px;
}
.search-input{
width:100%;
background:var(--card);
border:1px solid var(--ember);
color:var(--bone);
font-family:'Inter',sans-serif;
font-size:0.88rem;
padding:11px 16px 11px 38px;
border-radius:8px;
outline:none;
transition:border-color 0.2s ease;
}
.search-input::placeholder{color:var(--bone-dim);}
.search-input:focus{border-color:var(--bone-dim);}
.search-icon{
position:absolute;
left:34px;top:50%;
transform:translateY(-50%);
width:15px;height:15px;
pointer-events:none;
opacity:0.55;
}

.filter-row{
position:relative;z-index:2;
display:flex;
gap:8px;
justify-content:center;
flex-wrap:wrap;
padding:0 20px 36px;
}
.filter-chip{
font-size:0.72rem;
letter-spacing:0.05em;
text-transform:uppercase;
font-weight:600;
color:var(--bone-dim);
background:transparent;
border:1px solid var(--ember);
padding:7px 16px;
border-radius:100px;
cursor:pointer;
transition:all 0.2s ease;
}
.filter-chip:hover{border-color:var(--blood-bright);color:var(--bone);}
.filter-chip.active{
background:var(--blood-bright);
border-color:var(--blood-bright);
color:#0c0a0a;
}

main{
position:relative;z-index:2;
max-width:1080px;
margin:0 auto;
padding:0 20px 40px;
display:flex;
flex-direction:column;
gap:44px;
}

.franchise{display:block;}

.franchise-head{
display:flex;
align-items:baseline;
gap:14px;
margin-bottom:16px;
border-bottom:1px solid var(--ember);
padding-bottom:10px;
}
.franchise-title{
font-family:'Bebas Neue',sans-serif;
font-size:1.5rem;
letter-spacing:0.02em;
}
.franchise-sub{
font-size:0.75rem;
color:var(--bone-dim);
letter-spacing:0.02em;
}

.season-row{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:14px;
}

.card{
display:flex;
background:var(--card);
border:1px solid var(--ember);
border-radius:8px;
overflow:hidden;
text-decoration:none;
color:inherit;
position:relative;
transition:border-color 0.25s ease, transform 0.2s ease, background 0.25s ease;
}
.card:hover{
border-color:var(--blood-bright);
background:var(--card-hover);
transform:translateY(-2px);
}
.card:hover .card-thumb img{transform:scale(1.06);}
.card:hover .slash{opacity:1;transform:translateX(0);}

.card-thumb{
flex:0 0 96px;
width:96px;
position:relative;
overflow:hidden;
background:linear-gradient(160deg,#2a1414,#160a0a);
}
.card-thumb img{
width:100%;height:100%;
object-fit:cover;
display:block;
transition:transform 0.4s ease;
position:relative;
z-index:1;
}
.thumb-fallback{
position:absolute;inset:0;
display:flex;
align-items:center;
justify-content:center;
font-family:'Bebas Neue',sans-serif;
font-size:1.6rem;
color:var(--blood-bright);
opacity:0.5;
text-align:center;
padding:8px;
}

.slash{
position:absolute;
top:0;bottom:0;left:0;
width:3px;
background:var(--blood-bright);
opacity:0;
transform:translateX(-4px);
transition:all 0.25s ease;
}

.card-body{
flex:1;
padding:12px 14px;
display:flex;
flex-direction:column;
justify-content:center;
gap:5px;
min-width:0;
}
.card-season{
font-size:0.68rem;
letter-spacing:0.07em;
text-transform:uppercase;
color:var(--gold);
font-weight:600;
}
.card-title{
font-family:'Bebas Neue',sans-serif;
font-size:1.08rem;
letter-spacing:0.01em;
line-height:1.15;
}
.card-foot{
display:flex;
align-items:center;
gap:10px;
margin-top:2px;
}
.card-rating{
font-family:'Bebas Neue',sans-serif;
font-size:0.95rem;
color:var(--blood-bright);
}
.card-ep{
font-size:0.7rem;
color:var(--bone-dim);
}

/* ---------- NEW PAGINATION STYLES ---------- */
.pagination-row {
position: relative;
z-index: 2;
display: flex;
justify-content: center;
align-items: center;
gap: 15px;
padding: 20px 20px 50px;
}
.pagination-btn {
font-size: 0.8rem;
letter-spacing: 0.05em;
text-transform: uppercase;
font-weight: 600;
color: var(--bone);
background: var(--card);
border: 1px solid var(--ember);
padding: 10px 20px;
border-radius: 6px;
cursor: pointer;
transition: all 0.2s ease;
}
.pagination-btn:hover:not(:disabled) {
border-color: var(--blood-bright);
background: var(--card-hover);
}
.pagination-btn:disabled {
opacity: 0.3;
cursor: not-allowed;
border-color: var(--ember);
}
.page-indicator {
font-size: 0.85rem;
color: var(--bone-dim);
font-weight: 500;
}

/* ---------- LATEST UPLOADS WIDGET ---------- */
.latest-uploads{
position:relative;z-index:2;
max-width:1080px;
margin:0 auto 8px;
padding:0 20px;
}
.latest-uploads-card{
background:var(--card);
border:1px solid var(--ember);
border-radius:8px;
overflow:hidden;
}
.latest-uploads-head{
font-family:'Bebas Neue',sans-serif;
font-size:1.3rem;
letter-spacing:0.03em;
padding:14px 18px;
background:var(--card-hover);
border-bottom:1px solid var(--ember);
}
.latest-uploads-list a{
display:block;
padding:13px 18px;
color:var(--blood-bright);
text-decoration:none;
font-size:0.92rem;
font-weight:600;
line-height:1.4;
border-bottom:1px solid rgba(255,255,255,0.05);
transition:background 0.15s ease, color 0.15s ease, padding-left 0.15s ease;
}
.latest-uploads-list a:last-child{border-bottom:none;}
.latest-uploads-list a:hover{
background:var(--card-hover);
color:var(--bone);
padding-left:22px;
}

footer{
position:relative;z-index:2;
text-align:center;
padding:28px 24px;
color:var(--bone-dim);
font-size:0.75rem;
border-top:1px solid var(--ember);
line-height:1.6;
}
footer strong{color:var(--bone);}

@media (max-width:480px){
.stat-strip{gap:20px;}
.card-thumb{flex:0 0 76px;width:76px;}
.card-title{font-size:0.98rem;}
}
</style>

</head>
<body>
<div class="topnav">
  <button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="menu-panel" id="menuPanel">
    <a href="about.html">About</a>
    <a href="request.html">Request Anime</a>
    <a href="dmca.html">DMCA</a>
  </div>
</div>

<header>
  <div class="mark"><div class="mark-glyph"></div></div>
  <div class="brand"><span class="hi">HINDI</span><span class="ja">ANIME</span><span class="hi">STUFF</span></div>
  <div class="tagline">Dubbed anime, discovered. Watch officially, every time.</div>
  <div class="stat-strip" id="statStrip"></div>
</header>

<div class="search-wrap">
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <input type="text" class="search-input" id="searchInput" placeholder="Search anime…">
</div>

<div class="filter-row" id="filterRow"></div>

<main id="franchiseList"></main>

<div class="pagination-row">
  <button class="pagination-btn" id="prevPageBtn">Previous</button>
  <span class="page-indicator" id="pageIndicator">Page 1 of 1</span>
  <button class="pagination-btn" id="nextPageBtn">Next</button>
</div>

<div class="latest-uploads">
  <div class="latest-uploads-card">
    <div class="latest-uploads-head">Latest Uploads</div>
    <div class="latest-uploads-list" id="latestUploadsList"></div>
  </div>
</div>

<footer>
  &copy; HindiAnimeStuff
</footer>

<script src="data.js"></script>
<script>
  // Global States for Pagination & Filtering
  let currentPage = 1;
  const itemsPerPage = 4; // Ek page par kitni series dikhani hain (Aap ise 4, 6 ya 8 kar sakte hain)
  let activeGenre = 'all';
  let finalFilteredKeys = []; // used by the normal franchise-grouped view

  // Group by franchise — use explicit franchise key if provided, else title
  const groups = {};
  const displayTitle = {};
  ANIME_DATA.forEach(item => {
    const key = item.franchise || item.title;
    if(!groups[key]) groups[key] = [];
    groups[key].push(item);
    if(!displayTitle[key] || item.title.length < displayTitle[key].length){
      displayTitle[key] = item.title;
    }
  });

  // Latest Uploads widget — naya anime aap data.js me ARRAY KE SABSE UPER
  // (start me) add karte ho, isliye sabse naye entries hamesha
  // ANIME_DATA ke pehle N items hote hain — koi slice(-N).reverse() nahi chahiye.
  const LATEST_UPLOADS_COUNT = 10;
  const latestUploads = ANIME_DATA.slice(0, LATEST_UPLOADS_COUNT);

  // Stats
  const totalSeasons = ANIME_DATA.length;
  const totalFranchises = Object.keys(groups).length;
  const allGenres = [...new Set(ANIME_DATA.flatMap(a => a.genres))].sort();
  document.getElementById('statStrip').innerHTML = `
    <div class="stat"><div class="stat-num">${totalFranchises}</div><div class="stat-label">Series</div></div>
    <div class="stat"><div class="stat-num">${totalSeasons}</div><div class="stat-label">Seasons & Films</div></div>
    <div class="stat"><div class="stat-num">${allGenres.length}</div><div class="stat-label">Genres</div></div>
  `;

  // Filter chips — sirf genre chips, "Recently Added" button hata diya gaya hai
  // kyunki ye ab niche "Latest Uploads" box me already dikh rahaa hai.
  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML =
    `<button class="filter-chip active" data-genre="all">All</button>` +
    allGenres.map(g => `<button class="filter-chip" data-genre="${g}">${g}</button>`).join('');

  // Render the Latest Uploads list — simple text links, jaisa screenshot me hai,
  // card grid nahi. Yeh static rehta hai, search/genre filter se affect nahi hota.
  function latestUploadLabel(item){
    const isMulti = (item.language || '').split('·').length > 1;
    return `${item.title} ${item.season} Added ${isMulti ? 'Multi Audio' : 'Hindi Audio'}`;
  }
  document.getElementById('latestUploadsList').innerHTML = latestUploads.map(item =>
    `<a href="details.html?id=${item.id}">${latestUploadLabel(item)}</a>`
  ).join('');

  const list = document.getElementById('franchiseList');

  function cardHTML(item){
    return `
      <a class="card" href="details.html?id=${item.id}">
        <div class="card-thumb">
          <div class="thumb-fallback">${item.season.replace('Season ', 'S')}</div>
          <img src="${item.thumb}" alt="${item.title} ${item.season}" loading="lazy"
               onerror="this.style.display='none'">
        </div>
        <div class="card-body">
          <span class="card-season">${item.season}</span>
          <div class="card-title">${item.title.length > 34 ? item.title.slice(0,32)+'…' : item.title}</div>
          <div class="card-foot">
            <span class="card-rating">★ ${item.rating}</span>
            <span class="card-ep">${item.episodes ? item.episodes + ' episodes' : item.runtime}</span>
          </div>
        </div>
        <div class="slash"></div>
      </a>
    `;
  }

  // Core Function: Filters data first, then handles pagination & rendering
  function applyFiltersAndPagination() {
    const query = searchInput.value.trim().toLowerCase();

    finalFilteredKeys = Object.keys(groups).filter(key => {
      const seasons = groups[key];
      const title = displayTitle[key];
      const genres = [...new Set(seasons.flatMap(s => s.genres))];

      const genreMatch = activeGenre === 'all' || genres.includes(activeGenre);
      const titleMatch = !query || title.toLowerCase().includes(query);

      return genreMatch && titleMatch;
    });

    // Total pages calculation
    const totalPages = Math.ceil(finalFilteredKeys.length / itemsPerPage) || 1;
    if (currentPage > totalPages) currentPage = totalPages;

    // Ab current page ke hisab se sliced array nikalna
    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = startIndex + itemsPerPage;
    const keysToRender = finalFilteredKeys.slice(startIndex, endIndex);

    // Container clean karo aur cards render karo
    list.innerHTML = '';

    if (keysToRender.length === 0) {
      list.innerHTML = `<p style="text-align:center; color:var(--bone-dim); padding: 40px 0;">No anime found matching your criteria.</p>`;
    }

    keysToRender.forEach(key => {
      const seasons = groups[key];
      const title = displayTitle[key];
      const genres = [...new Set(seasons.flatMap(s => s.genres))];

      const block = document.createElement('div');
      block.className = 'franchise';

      const seasonCards = seasons.map(cardHTML).join('');

      block.innerHTML = `
        <div class="franchise-head">
          <span class="franchise-title">${title}</span>
          <span class="franchise-sub">${seasons.length} ${seasons.length > 1 ? 'seasons' : 'release'} · ${genres.slice(0,3).join(', ')}</span>
        </div>
        <div class="season-row">${seasonCards}</div>
      `;
      list.appendChild(block);
    });

    // Pagination Controls UI update karo
    document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevPageBtn').disabled = (currentPage === 1);
    document.getElementById('nextPageBtn').disabled = (currentPage === totalPages);
  }

  // Input events trigger pagination filter logic
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', () => {
    currentPage = 1; // Jab bhi search ho, page 1 par laayein
    applyFiltersAndPagination();
  });

  // Genre filtering logic
  filterRow.addEventListener('click', e => {
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    filterRow.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    activeGenre = btn.dataset.genre;
    currentPage = 1; // Filter badalne par page 1 par laayein
    applyFiltersAndPagination();
  });

  // Pagination click events
  document.getElementById('prevPageBtn').addEventListener('click', () => {
    if (currentPage > 1) {
      currentPage--;
      applyFiltersAndPagination();
      window.scrollTo({ top: document.getElementById('filterRow').offsetTop - 20, behavior: 'smooth' });
    }
  });

  document.getElementById('nextPageBtn').addEventListener('click', () => {
    const totalPages = Math.ceil(finalFilteredKeys.length / itemsPerPage) || 1;
    if (currentPage < totalPages) {
      currentPage++;
      applyFiltersAndPagination();
      window.scrollTo({ top: document.getElementById('filterRow').offsetTop - 20, behavior: 'smooth' });
    }
  });

  // Hamburger Menu logic
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  menuBtn.addEventListener('click', () => {
    menuBtn.classList.toggle('open');
    menuPanel.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if(!menuBtn.contains(e.target) && !menuPanel.contains(e.target)){
      menuBtn.classList.remove('open');
      menuPanel.classList.remove('open');
    }
  });

  // Initial Run to Render Page 1
  applyFiltersAndPagination();
</script>
</body>
</html>
